// Spike KARV-131, wird nicht gemergt: Test-Identitaet fuer Update-Weg W4 (Desktop.open aus dem Paket).
include required("conveyor.conf")
app {
  display-name = "Kartenverwaltung FX-W4"
  fsname = "ecv-karten-fxw4"
  machines = ["windows.amd64"]
  site.base-url = "http://localhost:8765/w4/"
  windows.certificate = "self signed by CN=Kartenverwaltung - Eltviller Carneval Verein"
  jvm {
    system-properties { "karten.probe" = "W4" }
    windows.options += "-Dkarten.appDataDir=D:/Kartenverwaltung/Test/KARV-131/w4"
  }
}
