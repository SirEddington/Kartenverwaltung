name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Der Runner ist Linux: JavaFX-Natives für Linux (-Plinux statt des Windows-Standards) und ein virtuelles
      # Display, sonst starten die Tests mit JavaFX-Toolkit nicht ("No toolkit found")
      - name: Run tests
        run: xvfb-run --auto-servernum ./mvnw --batch-mode -Plinux test

      # KARV-125: Der Release-Text aus patchnotes.md entsteht bei jedem Push wie im Release (Jar, Klasse, Inhalt),
      # damit ein Fehler nicht erst beim Release auffällt
      - name: Release notes from patchnotes.md
        run: |
          ./mvnw --batch-mode package -Plinux -DskipTests
          bash .github/scripts/release-notes.sh
