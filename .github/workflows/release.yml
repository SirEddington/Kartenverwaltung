name: Release build

on:
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Erst die Tests wie in der CI: Der Runner ist Linux, also mit den JavaFX-Natives für
      # Linux und einem virtuellen Display (sonst "No toolkit found"). Dann zwei Fat-JARs mit
      # den jeweils passenden JavaFX-Natives (siehe pom.xml): zuerst Windows (Standardprofil),
      # dann Linux ohne "clean", damit das Windows-Jar in target/ erhalten bleibt.
      - name: Build jars with Maven
        run: |
          ./mvnw --batch-mode clean
          xvfb-run --auto-servernum ./mvnw --batch-mode -Plinux test
          ./mvnw --batch-mode package -DskipTests
          ./mvnw --batch-mode package -Plinux -DskipTests

      # KARV-125: Der Text des Releases kommt aus patchnotes.md. Erzeugt VOR Conveyor: Conveyor veröffentlicht sofort
      # (kein Entwurf), ein Fehler hier beendet den Lauf also, bevor ein Installer draußen ist.
      - name: Release notes from patchnotes.md
        run: bash .github/scripts/release-notes.sh

      # overwrite, damit ein erneuter Lauf dieses Jobs nicht am schon vorhandenen Artefakt scheitert
      - name: Keep release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          overwrite: true
          path: |
            release-notes.md
            release-version.txt

      # IMPORTANT: check https://conveyor.hydraulic.dev/latest/ for the current
      # version and bump the tag below (@v22.2) when it changes.
      #
      # "make copied-site" statt "make site": Conveyor laedt die Installer direkt als
      # GitHub-Release-Assets hoch (ueber die API, per OAUTH_TOKEN) und pflegt die kleine
      # Download-Seite in einem separaten "gh-pages"-Branch (siehe conveyor.conf). Damit
      # landen die 40-90 MB großen MSIX-/ZIP-Dateien nie mehr in der Git-Historie von main.
      - name: Build and publish with Conveyor
        uses: hydraulic-software/conveyor/actions/build@v22.2
        env:
          OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: make copied-site
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          agree_to_license: 1
          extra_flags: -Kconveyor.billing-email="${{ secrets.CONVEYOR_BILLING_EMAIL }}"

  # KARV-125: Eigener Job, damit "Re-run failed jobs" nur diesen Schritt wiederholt und nie Conveyor.
  # Ersetzt den Text, den Conveyor setzt, durch die Patchnotes der Version (der Download-Link bleibt).
  release-notes:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$(cat release-version.txt)" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
