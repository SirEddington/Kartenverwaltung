// Spike KARV-131, wird nicht gemergt: Test-Identitaet fuer Update-Weg W3.
include required("conveyor.conf")
app {
  display-name = "Kartenverwaltung FX-W3"
  fsname = "ecv-karten-fxw3"
  machines = ["windows.amd64"]
  site.base-url = "http://localhost:8765/w3/"
  windows.certificate = "self signed by CN=Kartenverwaltung - Eltviller Carneval Verein"
  jvm {
    system-properties { "karten.probe" = "W3", "karten.probe.pkg" = "*Fxw3" }
    windows.options += "-Dkarten.appDataDir=D:/Kartenverwaltung/Test/KARV-131/w3"
  }
}
