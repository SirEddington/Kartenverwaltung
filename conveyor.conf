// Neue Version erstellen (ausführlich: docs/installation.md, "Releasing")
// 1. app.version weiter unten hochstellen
// 2. <version> in der pom.xml hochstellen
//    (die Jar-Namen der Plattform-Inputs weiter unten leiten sich aus app.version ab)
// 3. Oben in src/main/resources/de/eltviller_carneval_verein/karten/patchnotes.md einen Abschnitt für die neue
//    Version anlegen, mit mindestens einem echten Eintrag (KARV-125; PatchNotesBundledTest prüft das)
// 4. Vor dem Release die Patchnotes gegen die Tickets der fixVersion abgleichen und freigeben lassen
// Release über .github/workflows/release.yml (manuell auslösbar); danach die Release-Seite auf GitHub ansehen

include "deployment/conveyor.local.conf"

// Importiert JDK 21 von Amazon Corretto für ALLE Plattformen (Windows, macOS, Linux)
include "/stdlib/jdk/21/amazon.conf"

app {
  display-name = "Kartenverwaltung - Eltviller Carneval Verein"
  fsname = "ecv-karten"
  vendor = "Eltviller Carneval Verein"
  version = "1.1.0"

  // KARV-130: Windows sucht nicht mehr selbst im Hintergrund nach Updates (das .appinstaller
  // enthaelt dann keine UpdateSettings). Aktualisiert wird nur, wenn der Nutzer in der App
  // zustimmt (KARV-131) oder ueber den
  // gemeinsamen Ordner (KARV-132). Begruendung und Pruefergebnisse: docs/decisions.md.
  updates = manual

  license = "GPL-3.0-only"
  vcs-url = "https://github.com/SirEddington/Kartenverwaltung"

  // Windows und Linux (x64). Jede Plattform bekommt ihr eigenes Fat-JAR mit den passenden
  // JavaFX-Natives (siehe pom.xml, Profil "linux" und die Inputs weiter unten). macOS ist
  // bewusst nicht dabei: Mac-Pakete muessten signiert und notarisiert werden (Apple-Konto).
  machines = ["windows.amd64", "linux.amd64.glibc"]

  // App-Icon für Desktop-Verknüpfung, Startmenü und Taskleiste (Conveyor erzeugt
  // daraus automatisch .ico/.icns für die jeweilige Plattform)
  icons = "src/main/resources/de/eltviller_carneval_verein/karten/ui/images/harlekin_logo.png"

  // Java-Hauptklasse definieren
  jvm {
    main-class = "de.eltviller_carneval_verein.karten.MainApp"
    gui = "de.eltviller_carneval_verein.karten.MainApp"
    options += "--add-opens=javafx.controls/javafx.scene.control.skin=org.controlsfx.controls"

    // KARV-137: Die nativen JavaFX-Bibliotheken beim Bauen aus dem Fat-JAR holen und ins Paket legen
    // (Windows bin\, Linux lib/runtime/lib), statt sie bei jedem Start in den gemeinsamen
    // Zwischenspeicher ~/.openjfx auszupacken. Dort hat Norton sie in KARV-130 geloescht und gesperrt.
    // Siehe docs/decisions.md, "JavaFX native libraries extracted at build time".
    extract-native-libraries = true

    // FXMLLoader laedt intern mehrere JDK-Module nur reflektiv/optional (z.B.
    // javax.script.* fuer <fx:script>, javax.xml.stream.* zum Parsen der FXML-Datei
    // selbst). Die automatische jdeps-Erkennung (Standard: "detect") findet diese
    // Abhaengigkeiten NICHT, weshalb die schlanke gebaute Laufzeit ohne sie mit
    // NoClassDefFoundError abstuerzt - und zwar nacheinander, je nachdem welcher
    // FXMLLoader-Codepfad zuerst genutzt wird. Deshalb hier auf einmal die komplette,
    // fuer JavaFX+FXMLLoader ueblicherweise fehlende Modul-Liste ergaenzt statt nur
    // das jeweils zuletzt aufgetretene einzelne Modul.
    // Log-Datei (AppLogging) und GlobalErrorHandler nutzen java.util.logging
    modules += java.logging
    modules += java.scripting
    modules += java.xml
    modules += java.desktop
    modules += java.datatransfer
    modules += jdk.unsupported
    modules += jdk.unsupported.desktop
    modules += jdk.xml.dom
  }

  // Je Plattform das passende Fat-JAR (mvn package bzw. mvn package -Plinux).
  windows.amd64.inputs += "target/Kartenverwaltung-"${app.version}"-win.jar"
  linux.amd64.inputs += "target/Kartenverwaltung-"${app.version}"-linux.jar"

  // Kein self-hosted base-url mehr: da vcs-url eine GitHub-URL ist, zeigen Downloads und
  // Update-Checks damit automatisch auf die jeweils neueste GitHub Release. Die kleine
  // Download-Seite selbst landet ueber "make copied-site" (siehe release.yml) im
  // "gh-pages"-Branch statt in docs/ auf main - dadurch wachsen weder main noch dieser
  // Branch je durch committete Installer-Binaries.
  site {
    consistency-checks = warn
    github {
      oauth-token = ${env.OAUTH_TOKEN}
      pages-branch = "gh-pages"
    }
  }

  // KARV-137: Seit die JavaFX-.so lose im Paket liegen, leitet Conveyor die Debian-Abhaengigkeiten auch aus
  // ihnen ab, und zwar mit den Paketnamen von Ubuntu 24.04 ("...t64"). Die gibt es auf Ubuntu 22.04 und
  // Debian 12 nicht. Deshalb die automatisch ermittelten Eintraege entfernen ("-...") und durch Alternativen
  // mit den alten Namen ersetzen. Gemessen per apt-get install --simulate (Spike KARV-137).
  linux.debian.control.Depends = [
    "-libasound2t64 | liboss4-salsa-asound2"
    "libasound2t64 | libasound2 | liboss4-salsa-asound2"
    "-libatk1.0-0t64"
    "libatk1.0-0t64 | libatk1.0-0"
    "-libglib2.0-0t64"
    "libglib2.0-0t64 | libglib2.0-0"
    "-libgtk-3-0t64"
    "libgtk-3-0t64 | libgtk-3-0"
  ]

  // Windows-spezifische Optionen (greifen nur, wenn ein Tester auf Windows installiert)
  windows {
    dir-chooser = true
    per-user-install = true
    desktop-shortcut-prompt = true
    start-menu-shortcut = true

    // Der "Update Escape Hatch" (updatecheck.exe im Paket) wird von Norton
    // zuverlaessig als IDP.Generic erkannt und in Quarantaene verschoben, was die
    // App unbrauchbar macht. Er wird nur gebraucht, um Nutzer automatisch
    // neu zu installieren, falls sich App-Name oder Signierzertifikat aendern -
    // bei unserer kleinen, stabilen Nutzergruppe ist ein einmaliger manueller
    // Neuinstall in diesem (unwahrscheinlichen) Fall vertretbar.
    manifests {
      msix {
        use-update-escape-hatch = false
      }
    }
  }
}

conveyor.compatibility-level = 23