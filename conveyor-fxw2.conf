// Spike KARV-131, wird nicht gemergt: Test-Identitaet fuer Update-Weg W2.
include required("conveyor.conf")
app {
  display-name = "Kartenverwaltung FX-W2"
  fsname = "ecv-karten-fxw2"
  machines = ["windows.amd64"]
  site.base-url = "http://localhost:8765/w2/"
  windows.certificate = "self signed by CN=Kartenverwaltung - Eltviller Carneval Verein"
  jvm {
    system-properties { "karten.probe" = "W2", "karten.probe.pkg" = "*Fxw2" }
    windows.options += "-Dkarten.appDataDir=D:/Kartenverwaltung/Test/KARV-131/w2"
  }
}
